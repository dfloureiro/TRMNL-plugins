<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151515" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Parcels">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Parcels</title>
<!--
  Parcels for TRMNL. Everything you type stays in this browser (localStorage) and is sent
  only to the TRMNL webhook URL you enter in Settings. The page itself contains no data.
-->
<style>
  :root {
    --bg: #f6f5f2; --card: #ffffff; --ink: #151515; --muted: #6b6b6b; --line: #e3e1dc;
    --accent: #151515; --on-accent: #ffffff; --danger: #c0362c; --ok: #2f7d4f; --warn: #a86400;
    --radius: 14px;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151515; --card: #1f1f1f; --ink: #f1f0ec; --muted: #9a9a9a; --line: #2e2e2e;
            --accent: #f1f0ec; --on-accent: #151515; --danger: #ff6b5e; --ok: #5fc48a; --warn: #f0a640; }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: env(safe-area-inset-top) 0 calc(96px + env(safe-area-inset-bottom));
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px; }

  header { display: flex; align-items: center; gap: 12px; padding: 18px 0 10px; }
  header h1 { font-size: 28px; margin: 0; flex: 1; letter-spacing: -0.02em; }
  .icon-btn { border: 0; background: transparent; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; }
  .icon-btn:active { background: var(--line); }
  .icon-btn svg { width: 24px; height: 24px; }

  .status { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); min-height: 28px; margin-bottom: 8px; }
  .status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
  .status[data-kind="ok"] .dot { background: var(--ok); }
  .status[data-kind="busy"] .dot { background: var(--warn); }
  .status[data-kind="error"] { color: var(--danger); }
  .status[data-kind="error"] .dot { background: var(--danger); }
  .status button { margin-left: auto; border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 2px 12px; font-size: 14px; }

  .list { display: flex; flex-direction: column; gap: 10px; padding: 0; margin: 0; list-style: none; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; }
  .row { display: flex; align-items: center; gap: 12px; }
  .handle { flex: none; border: 0; background: none; color: var(--muted); width: 32px; height: 44px; margin: -6px -4px -6px -8px; display: grid; place-items: center;
            touch-action: none; cursor: grab; border-radius: 8px; -webkit-touch-callout: none; user-select: none; -webkit-user-select: none; }
  .handle svg { width: 20px; height: 20px; }
  .card.dragging { position: relative; z-index: 5; box-shadow: 0 10px 28px rgb(0 0 0 / 0.22); transition: none !important; }
  .list.sorting { user-select: none; -webkit-user-select: none; }
  .list.sorting .card:not(.dragging) { transition: transform 0.15s; }
  .row .text { flex: 1; min-width: 0; }
  .label { font-weight: 600; font-size: 17px; overflow-wrap: anywhere; }
  .tid { font: 14px/1.3 ui-monospace, "SF Mono", Menlo, monospace; color: var(--muted); border: 0; background: none; padding: 2px 0; text-align: left; overflow-wrap: anywhere; }
  .code { flex: none; border: 0; background: var(--accent); color: var(--on-accent); border-radius: 10px; padding: 6px 12px;
          font: 600 20px/1.2 ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: 0.06em; }
  .actions { display: flex; gap: 6px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
  .actions a, .actions button { border: 0; background: transparent; color: var(--muted); font-size: 14px; padding: 6px 10px; border-radius: 8px; text-decoration: none; }
  .actions a:active, .actions button:active { background: var(--line); }
  .actions .del { margin-left: auto; color: var(--danger); }

  .empty { text-align: center; color: var(--muted); padding: 48px 16px; }
  .empty svg { width: 56px; height: 56px; opacity: 0.6; }
  .setup { background: var(--card); border: 1px dashed var(--muted); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; }
  .setup h2 { margin: 0 0 10px; font-size: 18px; }
  .setup ol { margin: 0 0 12px; padding-left: 22px; }
  .setup li { margin-bottom: 4px; }
  .setup .connect { display: flex; gap: 8px; }
  .setup .connect input { flex: 1; min-width: 0; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); font-size: 16px; }
  .setup .small { font-size: 13px; color: var(--muted); margin: 10px 0 0; }
  .setup .small.err { color: var(--danger); }

  .fab { position: fixed; right: max(16px, calc(50% - 264px)); bottom: calc(20px + env(safe-area-inset-bottom)); width: 60px; height: 60px; border-radius: 50%;
         border: 0; background: var(--accent); color: var(--on-accent); box-shadow: 0 6px 20px rgb(0 0 0 / 0.25); display: grid; place-items: center; }
  .fab svg { width: 28px; height: 28px; }

  dialog { border: 0; padding: 0; width: min(560px, 100%); max-width: 100%; margin: auto auto 0; background: var(--card); color: var(--ink);
           border-radius: 20px 20px 0 0; max-height: 92vh; }
  dialog::backdrop { background: rgb(0 0 0 / 0.4); }
  @media (min-width: 600px) { dialog { margin: auto; border-radius: 20px; } }
  .sheet { padding: 20px 16px calc(20px + env(safe-area-inset-bottom)); }
  .sheet h2 { margin: 0 0 14px; font-size: 20px; }
  .field { display: block; margin-bottom: 14px; }
  .field span { display: block; font-size: 14px; color: var(--muted); margin-bottom: 4px; }
  .field input { width: 100%; padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); font-size: 17px; }
  .field input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .field .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  .hint { font-size: 13px; color: var(--muted); margin: -8px 0 14px; }
  .hint.err { color: var(--danger); }
  .buttons { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; flex-wrap: wrap; }
  .btn { border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 10px 16px; }
  .btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 600; }
  .btn.danger { color: var(--danger); }
  .group { border-top: 1px solid var(--line); padding-top: 16px; margin-top: 18px; }
  .group h3 { font-size: 15px; margin: 0 0 8px; }
  textarea { width: 100%; min-height: 100px; padding: 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); font: 13px ui-monospace, Menlo, monospace; }

  .toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--ink); color: var(--bg);
           padding: 10px 16px; border-radius: 999px; font-size: 15px; display: flex; gap: 14px; align-items: center; box-shadow: 0 6px 20px rgb(0 0 0 / 0.25);
           max-width: calc(100% - 32px); }
  .toast[hidden] { display: none; }
  .toast button { border: 0; background: none; color: inherit; font-weight: 700; text-decoration: underline; padding: 0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title">Parcels</h1>
    <button class="icon-btn" id="settingsBtn" aria-label="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </header>
  <div class="status" id="status" role="status" aria-live="polite"><span class="dot"></span><span id="statusText"></span></div>
  <form id="setup" class="setup" hidden autocomplete="off">
    <h2 id="setupTitle"></h2>
    <ol><li id="setupStep1"></li><li id="setupStep2"></li><li id="setupStep3"></li></ol>
    <div class="connect">
      <input id="setupUrl" type="url" inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="https://trmnl.com/api/custom_plugins/…" aria-labelledby="setupStep3">
      <button type="submit" class="btn primary" id="setupBtn"></button>
    </div>
    <p class="small" id="setupHint"></p>
  </form>
  <ul class="list" id="list"></ul>
  <div class="empty" id="empty" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M3 7.5 12 3l9 4.5v9L12 21l-9-4.5z"/><path d="M3 7.5 12 12l9-4.5M12 12v9M7.5 5.25l9 4.5"/></svg>
    <p id="emptyText"></p>
  </div>
</div>

<button class="fab" id="addBtn" aria-label="Add parcel">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</button>

<dialog id="editDialog">
  <form class="sheet" id="editForm" method="dialog" autocomplete="off">
    <h2 id="editTitle"></h2>
    <label class="field"><span id="fLabelL"></span><input id="fLabel" maxlength="80" enterkeyhint="next"></label>
    <label class="field"><span id="fIdL"></span><input id="fId" class="mono" maxlength="60" autocapitalize="characters" autocorrect="off" spellcheck="false" enterkeyhint="next"></label>
    <label class="field"><span id="fCodeL"></span><input id="fCode" class="mono" maxlength="30" autocapitalize="characters" autocorrect="off" spellcheck="false" enterkeyhint="done"></label>
    <p class="hint err" id="editErr" hidden></p>
    <div class="buttons">
      <button type="button" class="btn" id="editCancel"></button>
      <button type="submit" class="btn primary" id="editSave"></button>
    </div>
  </form>
</dialog>

<dialog id="settingsDialog">
  <form class="sheet" id="settingsForm" method="dialog" autocomplete="off">
    <h2 id="sTitle"></h2>
    <label class="field"><span id="sUrlL"></span><input id="sUrl" type="url" inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="https://trmnl.com/api/custom_plugins/…"></label>
    <p class="hint" id="sUrlHint"></p>
    <div class="buttons">
      <button type="button" class="btn" id="sSend"></button>
      <button type="submit" class="btn primary" id="sSave"></button>
    </div>
    <div class="group">
      <h3 id="bTitle"></h3>
      <p class="hint" id="bHint" style="margin:0 0 10px"></p>
      <div class="buttons" style="justify-content:flex-start">
        <button type="button" class="btn" id="bExport"></button>
        <button type="button" class="btn" id="bImport"></button>
      </div>
      <div id="importBox" hidden style="margin-top:10px">
        <textarea id="importText" spellcheck="false"></textarea>
        <div class="buttons"><button type="button" class="btn primary" id="bImportGo"></button></div>
      </div>
    </div>
    <div class="group">
      <p class="hint" id="sizeHint" style="margin:0"></p>
    </div>
    <div class="buttons"><button type="button" class="btn" id="sClose"></button></div>
  </form>
</dialog>

<div class="toast" id="toast" hidden><span id="toastText"></span><button id="toastAction" hidden></button></div>

<script>
"use strict";
(function () {
  // ---------- Text ----------
  var STRINGS = {
    en: {
      title: "Parcels", add: "Add parcel", edit: "Edit parcel", label: "What is it?", id: "Tracking ID",
      code: "Pickup code", optional: " (optional)", save: "Save", cancel: "Cancel", needOne: "Enter a name or a tracking ID.",
      empty: "Nothing on the way. Tap + to add a parcel.", track: "Track", editBtn: "Edit", del: "Received", move: "Drag to reorder",
      removed: "Removed", undo: "Undo", copied: "Copied",
      setupTitle: "Connect your TRMNL",
      setupStep1: "In TRMNL, add the Parcels plugin and put it in your device's playlist.",
      setupStep2: "Open the plugin's settings and copy its Webhook URL.",
      setupStep3: "Paste it here:", setupBtn: "Connect",
      setupHint: "The URL is saved only in this browser. Your parcels go only to your TRMNL. Already using Parcels on another device? Paste the same URL and your list loads here. You can also add parcels first and connect later.",
      settings: "Settings", url: "TRMNL webhook URL",
      urlHint: "In TRMNL, open the Parcels plugin settings and copy the Webhook URL. It is stored only on this device. Treat it like a password.",
      urlBad: "That doesn't look like a TRMNL webhook URL (https://trmnl.com/api/custom_plugins/…).",
      sendNow: "Send now", close: "Close",
      backup: "Backup", backupHint: "Your list lives in this browser. Keep a copy in case the browser clears it.",
      export: "Copy backup", import: "Restore…", importGo: "Restore this backup", importBad: "That isn't a Parcels backup.",
      imported: "Backup restored", exported: "Backup copied",
      size: function (b) { return "Data sent to TRMNL: " + b + " bytes. TRMNL accepts about 2 KB per update (5 KB with TRMNL+)."; },
      notSetUp: "Not connected to TRMNL", sending: "Sending to TRMNL…", sentAt: function (t) { return "On TRMNL · sent " + t; },
      pending: "Changes not sent yet", retry: "Retry", failed: function (m) { return "Not sent: " + m; },
      offline: "You're offline", restored: "Loaded the list from TRMNL",
      tooMany: "TRMNL's limit on updates per hour was reached. Try again later.", tooBig: "The list is larger than TRMNL accepts in one update."
    },
    pt: {
      title: "Encomendas", add: "Nova encomenda", edit: "Editar encomenda", label: "O que é?", id: "Código de seguimento",
      code: "Código de levantamento", optional: " (opcional)", save: "Guardar", cancel: "Cancelar", needOne: "Indique um nome ou um código de seguimento.",
      empty: "Nada a caminho. Toque em + para adicionar.", track: "Seguir", editBtn: "Editar", del: "Recebida", move: "Arraste para reordenar",
      removed: "Removida", undo: "Anular", copied: "Copiado",
      setupTitle: "Ligue o seu TRMNL",
      setupStep1: "No TRMNL, adicione o plugin Parcels e ponha-o na playlist do seu dispositivo.",
      setupStep2: "Abra as definições do plugin e copie o Webhook URL.",
      setupStep3: "Cole-o aqui:", setupBtn: "Ligar",
      setupHint: "O URL fica guardado só neste browser. As encomendas vão só para o seu TRMNL. Já usa o Parcels noutro dispositivo? Cole o mesmo URL e a lista aparece aqui. Também pode adicionar encomendas primeiro e ligar depois.",
      settings: "Definições", url: "URL do webhook do TRMNL",
      urlHint: "No TRMNL, abra as definições do plugin Encomendas e copie o Webhook URL. Fica guardado só neste dispositivo. Trate-o como uma palavra-passe.",
      urlBad: "Isto não parece um URL de webhook do TRMNL (https://trmnl.com/api/custom_plugins/…).",
      sendNow: "Enviar agora", close: "Fechar",
      backup: "Cópia de segurança", backupHint: "A lista fica neste browser. Guarde uma cópia caso o browser a apague.",
      export: "Copiar cópia", import: "Restaurar…", importGo: "Restaurar esta cópia", importBad: "Isto não é uma cópia do Encomendas.",
      imported: "Cópia restaurada", exported: "Cópia copiada",
      size: function (b) { return "Dados enviados ao TRMNL: " + b + " bytes. O TRMNL aceita cerca de 2 KB por atualização (5 KB com TRMNL+)."; },
      notSetUp: "Sem ligação ao TRMNL", sending: "A enviar para o TRMNL…", sentAt: function (t) { return "No TRMNL · enviado " + t; },
      pending: "Alterações por enviar", retry: "Tentar", failed: function (m) { return "Não enviado: " + m; },
      offline: "Sem ligação à internet", restored: "Lista carregada do TRMNL",
      tooMany: "Atingiu o limite de atualizações por hora do TRMNL. Tente mais tarde.", tooBig: "A lista é maior do que o TRMNL aceita numa atualização."
    }
  };
  var LANG = /^pt/i.test(navigator.language || "") ? "pt" : "en";
  var T = STRINGS[LANG];
  document.documentElement.lang = LANG;

  // ---------- Storage ----------
  var KEY = "trmnl-parcels:v1";
  var state = { parcels: [], updatedAt: 0, dirty: false, sentAt: 0, webhook: "" };
  try {
    var saved = JSON.parse(localStorage.getItem(KEY) || "null");
    if (saved && Array.isArray(saved.parcels)) state = Object.assign(state, saved);
  } catch (e) { /* storage unavailable: start empty */ }
  function persist() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

  // ---------- Helpers ----------
  var $ = function (id) { return document.getElementById(id); };
  function newKey() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
  function clean(s) { return String(s || "").replace(/\s+/g, " ").trim(); }
  function fmtTime(ms) {
    return new Date(ms).toLocaleString(LANG === "pt" ? "pt-PT" : undefined, { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
  }
  function isWebhook(url) { return /^https:\/\/(use)?trmnl\.com\/api\/custom_plugins\/[0-9a-f-]{8,}\/?$/i.test(url); }
  function payload() {
    // Only non-empty fields are sent, to stay well inside TRMNL's size limit.
    var parcels = state.parcels.map(function (p) {
      var o = {};
      if (p.label) o.label = p.label;
      if (p.id) o.id = p.id;
      if (p.code) o.code = p.code;
      return o;
    });
    // v: payload format version. Version 1 is documented in the README; keep it backwards compatible.
    return { merge_variables: { v: 1, parcels: parcels, updated: fmtTime(state.updatedAt || Date.now()), updated_at: state.updatedAt } };
  }
  function payloadBytes() { return new Blob([JSON.stringify(payload())]).size; }

  var toastTimer;
  function toast(text, actionLabel, action) {
    $("toastText").textContent = text;
    var btn = $("toastAction");
    btn.hidden = !actionLabel;
    btn.textContent = actionLabel || "";
    btn.onclick = function () { $("toast").hidden = true; if (action) action(); };
    $("toast").hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { $("toast").hidden = true; }, actionLabel ? 6000 : 2000);
  }
  function copy(text) {
    if (navigator.clipboard) navigator.clipboard.writeText(text).then(function () { toast(T.copied); }, function () {});
  }

  // ---------- Sync with TRMNL ----------
  var pushTimer, busy = false, lastError = "";
  function changed() {
    state.updatedAt = Date.now();
    state.dirty = true;
    lastError = "";
    persist();
    render();
    clearTimeout(pushTimer);
    // A short pause groups quick edits (and undo) into one update, as TRMNL limits updates per hour.
    pushTimer = setTimeout(push, 2500);
  }

  function push() {
    clearTimeout(pushTimer);
    if (!state.webhook || busy) { renderStatus(); return; }
    if (!navigator.onLine) { lastError = T.offline; renderStatus(); return; }
    busy = true; renderStatus();
    var sentVersion = state.updatedAt;
    fetch(state.webhook, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload()), referrerPolicy: "no-referrer" })
      .then(function (res) {
        if (res.ok) return null;
        return res.text().then(function (body) {
          var msg = "";
          try { msg = JSON.parse(body).message || JSON.parse(body).error || ""; } catch (e) { msg = body.slice(0, 160); }
          if (res.status === 429) return T.tooMany;
          if (res.status === 413) return T.tooBig;
          return "HTTP " + res.status + (msg ? " – " + msg : "");
        });
      })
      .then(function (err) {
        busy = false;
        if (err) { lastError = err; }
        else {
          lastError = "";
          state.sentAt = Date.now();
          // Edits made while sending stay pending and go out next.
          if (state.updatedAt === sentVersion) state.dirty = false; else pushTimer = setTimeout(push, 1000);
          persist();
        }
        renderStatus();
      }, function (e) {
        busy = false; lastError = navigator.onLine ? (e && e.message) || "network error" : T.offline; renderStatus();
      });
  }

  // TRMNL answers a GET on the webhook URL with the data it holds. If that data is newer than
  // this browser's copy (for example after Safari cleared storage, or edits from another
  // device), use it. If the request fails, nothing changes.
  // force: compare even with unsent local edits (used right after the URL is entered).
  function pull(force) {
    if (!state.webhook || (state.dirty && !force) || !navigator.onLine) return Promise.resolve();
    return fetch(state.webhook, { method: "GET", headers: { Accept: "application/json" }, referrerPolicy: "no-referrer" })
      .then(function (res) { return res.ok ? res.json() : null; })
      .then(function (j) {
        if (!j || (state.dirty && !force)) return;
        var mv = j.merge_variables || (j.data && j.data.merge_variables) || j.data || j;
        if (!mv || !Array.isArray(mv.parcels)) return;
        var remoteAt = Number(mv.updated_at) || 0;
        if (remoteAt <= state.updatedAt) return;
        state.parcels = mv.parcels.map(function (p) {
          return { k: newKey(), label: clean(p.label), id: clean(p.id), code: clean(p.code) };
        }).filter(function (p) { return p.label || p.id; });
        state.updatedAt = remoteAt;
        state.sentAt = remoteAt;
        state.dirty = false;
        persist(); render(); toast(T.restored);
      })
      .catch(function () {});
  }

  // ---------- Rendering ----------
  function renderStatus() {
    var el = $("status"), text = $("statusText");
    var old = el.querySelector("button"); if (old) old.remove();
    var kind = "", msg = "";
    if (!state.webhook) { msg = T.notSetUp; }
    else if (busy) { kind = "busy"; msg = T.sending; }
    else if (lastError) { kind = "error"; msg = T.failed(lastError); }
    else if (state.dirty) { kind = "busy"; msg = T.pending; }
    else if (state.sentAt) { kind = "ok"; msg = T.sentAt(fmtTime(state.sentAt)); }
    el.dataset.kind = kind;
    text.textContent = msg;
    if (state.webhook && !busy && (lastError || state.dirty)) {
      var b = document.createElement("button");
      b.type = "button"; b.textContent = T.retry; b.onclick = push;
      el.appendChild(b);
    }
    $("setup").hidden = !!state.webhook;
  }

  function render() {
    if (drag) { renderStatus(); return; } // never rebuild the list under a finger
    var list = $("list");
    list.textContent = "";
    state.parcels.forEach(function (p, i) {
      var li = document.createElement("li");
      li.className = "card";
      li.dataset.i = i;

      var row = document.createElement("div"); row.className = "row";
      if (state.parcels.length > 1) {
        var h = document.createElement("button"); h.type = "button"; h.className = "handle";
        h.setAttribute("aria-label", T.move); h.title = T.move;
        h.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg>';
        h.addEventListener("pointerdown", startDrag);
        // Older iOS can still scroll the page from the handle unless touchmove is cancelled.
        h.addEventListener("touchmove", function (e) { if (drag) e.preventDefault(); }, { passive: false });
        row.appendChild(h);
      }
      var text = document.createElement("div"); text.className = "text";
      var title = document.createElement("div"); title.className = "label";
      title.textContent = p.label || p.id;
      text.appendChild(title);
      if (p.label && p.id) {
        var tid = document.createElement("button"); tid.type = "button"; tid.className = "tid";
        tid.textContent = p.id; tid.onclick = function () { copy(p.id); };
        text.appendChild(tid);
      }
      row.appendChild(text);
      if (p.code) {
        var code = document.createElement("button"); code.type = "button"; code.className = "code";
        code.textContent = p.code; code.onclick = function () { copy(p.code); };
        row.appendChild(code);
      }
      li.appendChild(row);

      var actions = document.createElement("div"); actions.className = "actions";
      if (p.id) {
        var a = document.createElement("a");
        a.href = "https://t.17track.net/" + (LANG === "pt" ? "pt" : "en") + "#nums=" + encodeURIComponent(p.id);
        a.target = "_blank"; a.rel = "noopener noreferrer"; a.textContent = T.track + " ↗";
        actions.appendChild(a);
      }
      var e = document.createElement("button"); e.type = "button"; e.textContent = T.editBtn;
      e.onclick = function () { openEdit(i); };
      actions.appendChild(e);
      var d = document.createElement("button"); d.type = "button"; d.className = "del"; d.textContent = T.del + " ✓";
      d.onclick = function () { remove(i); };
      actions.appendChild(d);
      li.appendChild(actions);

      list.appendChild(li);
    });
    $("empty").hidden = state.parcels.length > 0;
    renderStatus();
  }

  // ---------- Reorder ----------
  // Drag a card by its handle. Nothing is moved in the page while the finger is down (iOS stops
  // sending touch events if the touched element is moved): the dragged card and the cards it
  // passes are only shifted with transforms. The new order is applied on release.
  var drag = null;
  function startDrag(ev) {
    if (drag || (ev.pointerType === "mouse" && ev.button !== 0)) return;
    ev.preventDefault();
    var li = ev.currentTarget.closest(".card");
    var cards = Array.prototype.slice.call($("list").children);
    var from = cards.indexOf(li);
    var tops = cards.map(function (c) { return c.offsetTop; });
    var heights = cards.map(function (c) { return c.offsetHeight; });
    var gap = cards.length > 1 ? tops[1] - tops[0] - heights[0] : 10;
    drag = { li: li, cards: cards, from: from, to: from, tops: tops, heights: heights, step: heights[from] + gap,
             id: ev.pointerId, startY: ev.clientY + window.scrollY, y: ev.clientY, raf: 0 };
    try { ev.currentTarget.setPointerCapture(ev.pointerId); } catch (e) {}
    li.classList.add("dragging");
    $("list").classList.add("sorting");
    window.addEventListener("pointermove", moveDrag, { passive: false });
    window.addEventListener("pointerup", endDrag);
    window.addEventListener("pointercancel", endDrag);
    drag.raf = requestAnimationFrame(autoScroll);
  }
  function place() {
    var d = drag;
    var offset = d.y + window.scrollY - d.startY;
    var top = d.tops[d.from] + offset;
    var lo = d.tops[0], hi = d.tops[d.tops.length - 1] + d.heights[d.heights.length - 1] - d.heights[d.from];
    top = Math.max(lo, Math.min(hi, top));
    var centre = top + d.heights[d.from] / 2;
    // Target index: how many of the other cards have their middle above the dragged card's middle.
    var to = 0;
    for (var k = 0; k < d.cards.length; k++) {
      if (k !== d.from && d.tops[k] + d.heights[k] / 2 < centre) to++;
    }
    d.to = to;
    for (var j = 0; j < d.cards.length; j++) {
      if (j === d.from) continue;
      var shift = 0;
      if (d.from < to && j > d.from && j <= to) shift = -d.step;
      if (d.from > to && j >= to && j < d.from) shift = d.step;
      d.cards[j].style.transform = shift ? "translateY(" + shift + "px)" : "";
    }
    d.li.style.transform = "translateY(" + (top - d.tops[d.from]) + "px)";
  }
  function moveDrag(ev) {
    if (!drag || ev.pointerId !== drag.id) return;
    ev.preventDefault();
    drag.y = ev.clientY;
    place();
  }
  // Scroll the page while the finger is held near the top or bottom edge.
  function autoScroll() {
    if (!drag) return;
    var edge = 80, h = window.innerHeight, dy = 0;
    if (drag.y < edge) dy = -Math.ceil((edge - drag.y) / 8);
    else if (drag.y > h - edge) dy = Math.ceil((drag.y - (h - edge)) / 8);
    if (dy) {
      var before = window.scrollY;
      window.scrollBy(0, dy);
      if (window.scrollY !== before) place();
    }
    drag.raf = requestAnimationFrame(autoScroll);
  }
  function endDrag(ev) {
    if (!drag || ev.pointerId !== drag.id) return;
    var d = drag; drag = null;
    cancelAnimationFrame(d.raf);
    window.removeEventListener("pointermove", moveDrag);
    window.removeEventListener("pointerup", endDrag);
    window.removeEventListener("pointercancel", endDrag);
    $("list").classList.remove("sorting");
    d.cards.forEach(function (c) { c.style.transform = ""; c.classList.remove("dragging"); });
    if (d.to !== d.from) {
      var moved = state.parcels.splice(d.from, 1)[0];
      state.parcels.splice(d.to, 0, moved);
      changed();
    }
  }

  // ---------- Actions ----------
  var editing = -1;
  function openEdit(i) {
    editing = i;
    var p = i >= 0 ? state.parcels[i] : { label: "", id: "", code: "" };
    $("editTitle").textContent = i >= 0 ? T.edit : T.add;
    $("fLabel").value = p.label || "";
    $("fId").value = p.id || "";
    $("fCode").value = p.code || "";
    $("editErr").hidden = true;
    $("editDialog").showModal();
    if (i < 0) $("fLabel").focus();
  }
  $("editForm").addEventListener("submit", function (ev) {
    var p = { label: clean($("fLabel").value), id: clean($("fId").value).replace(/\s/g, ""), code: clean($("fCode").value) };
    if (!p.label && !p.id) { ev.preventDefault(); $("editErr").textContent = T.needOne; $("editErr").hidden = false; return; }
    if (editing >= 0) { p.k = state.parcels[editing].k; state.parcels[editing] = p; }
    else { p.k = newKey(); state.parcels.unshift(p); }
    changed();
  });
  $("editCancel").onclick = function () { $("editDialog").close(); };

  function remove(i) {
    var gone = state.parcels.splice(i, 1)[0];
    changed();
    toast(T.removed + ": " + (gone.label || gone.id), T.undo, function () {
      state.parcels.splice(Math.min(i, state.parcels.length), 0, gone);
      changed();
    });
  }

  // Settings
  function openSettings() {
    $("sUrl").value = state.webhook;
    urlHint();
    $("importBox").hidden = true;
    $("sizeHint").textContent = T.size(payloadBytes());
    $("settingsDialog").showModal();
  }
  function urlHint() {
    var v = $("sUrl").value.trim();
    var bad = v && !isWebhook(v) && !(location.protocol === "http:" && /\/hook$/.test(v));
    $("sUrlHint").textContent = bad ? T.urlBad : T.urlHint;
    $("sUrlHint").classList.toggle("err", !!bad);
  }
  $("sUrl").addEventListener("input", urlHint);
  function urlAllowed(v) {
    // https only, except when the app itself runs over http (the local test server, see serve-app).
    return !v || /^https:\/\//i.test(v) || (location.protocol === "http:" && /^http:\/\//i.test(v));
  }
  function saveUrl(v) {
    v = (v === undefined ? $("sUrl").value : v).trim();
    if (!urlAllowed(v)) { urlHint(); return false; }
    if (v !== state.webhook) {
      state.webhook = v; lastError = "";
      // Only a list that was actually edited here counts as unsent; an empty new browser must
      // not wipe what TRMNL already shows.
      state.dirty = !!v && state.updatedAt > 0;
      persist();
    }
    return true;
  }
  $("settingsForm").addEventListener("submit", function (ev) {
    if (!saveUrl()) { ev.preventDefault(); return; }
    render();
    if (state.webhook) pull(true).then(function () { if (state.dirty) push(); });
  });
  $("sSend").onclick = function () { if (saveUrl()) { $("settingsDialog").close(); render(); push(); } };
  $("setup").addEventListener("submit", function (ev) {
    ev.preventDefault();
    var v = $("setupUrl").value.trim();
    var hint = $("setupHint");
    if (!v || !urlAllowed(v) || !(isWebhook(v) || location.protocol === "http:")) {
      hint.textContent = T.urlBad; hint.classList.add("err"); return;
    }
    hint.textContent = T.setupHint; hint.classList.remove("err");
    saveUrl(v);
    render();
    pull(true).then(function () { if (state.dirty) push(); });
  });
  $("sClose").onclick = function () { $("settingsDialog").close(); };

  $("bExport").onclick = function () {
    var data = JSON.stringify({ app: "trmnl-parcels", v: 1, updatedAt: state.updatedAt, parcels: state.parcels.map(function (p) { return { label: p.label, id: p.id, code: p.code }; }) });
    if (navigator.share && /iPhone|iPad|Android/i.test(navigator.userAgent)) {
      navigator.share({ title: T.title + " backup", text: data }).catch(function () {});
    } else if (navigator.clipboard) {
      navigator.clipboard.writeText(data).then(function () { toast(T.exported); }, function () {});
    }
  };
  $("bImport").onclick = function () { $("importBox").hidden = false; $("importText").value = ""; $("importText").focus(); };
  $("bImportGo").onclick = function () {
    try {
      var j = JSON.parse($("importText").value);
      if (!j || j.app !== "trmnl-parcels" || !Array.isArray(j.parcels)) throw new Error();
      state.parcels = j.parcels.map(function (p) { return { k: newKey(), label: clean(p.label), id: clean(p.id), code: clean(p.code) }; })
        .filter(function (p) { return p.label || p.id; });
      $("settingsDialog").close();
      changed();
      toast(T.imported);
    } catch (e) { toast(T.importBad); }
  };

  // ---------- Wire up ----------
  $("title").textContent = T.title;
  document.title = T.title;
  $("addBtn").setAttribute("aria-label", T.add);
  $("settingsBtn").setAttribute("aria-label", T.settings);
  $("emptyText").textContent = T.empty;
  $("setupTitle").textContent = T.setupTitle;
  $("setupStep1").textContent = T.setupStep1;
  $("setupStep2").textContent = T.setupStep2;
  $("setupStep3").textContent = T.setupStep3;
  $("setupHint").textContent = T.setupHint;
  $("setupBtn").textContent = T.setupBtn;
  $("fLabelL").textContent = T.label + T.optional;
  $("fIdL").textContent = T.id + T.optional;
  $("fCodeL").textContent = T.code + T.optional;
  $("editCancel").textContent = T.cancel;
  $("editSave").textContent = T.save;
  $("sTitle").textContent = T.settings;
  $("sUrlL").textContent = T.url;
  $("sSend").textContent = T.sendNow;
  $("sSave").textContent = T.save;
  $("sClose").textContent = T.close;
  $("bTitle").textContent = T.backup;
  $("bHint").textContent = T.backupHint;
  $("bExport").textContent = T.export;
  $("bImport").textContent = T.import;
  $("bImportGo").textContent = T.importGo;

  $("addBtn").onclick = function () { openEdit(-1); };
  $("settingsBtn").onclick = openSettings;
  // Tapping the dimmed background closes a sheet.
  [$("editDialog"), $("settingsDialog")].forEach(function (dlg) {
    dlg.addEventListener("click", function (ev) { if (ev.target === dlg) dlg.close(); });
  });

  window.addEventListener("online", function () { if (state.dirty) push(); else pull(); });
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible") { if (state.dirty) push(); else pull(); }
  });

  render();
  if (state.dirty) push(); else pull();
})();
</script>
</body>
</html>
