---
strategy: polling
no_screen_padding: 'no'
dark_mode: 'no'
static_data: ''
polling_verb: get
framework_version: 3.3.1
serverless_language: node
polling_url: 'https://api.tomtom.com/routing/1/calculateRoute/{% if return_trip == false or return_trip == "false" or return_trip == blank %}{{ origin }}:{{ destination }}{% else %}{{ destination }}:{{ origin }}{% endif %}/json?key={{ tomtom_api_key }}&traffic=true&maxAlternatives=2&routeType=fastest&computeTravelTimeFor=all&sectionType=traffic&instructionsType=coded&travelMode=car&routeRepresentation=summaryOnly{% if arrive_by != blank %}&arriveAt={{ "now" | date: "%Y-%m-%d" }}T{{ arrive_by }}:00{% endif %}'
polling_headers: ''
polling_body: ''
id: 477902
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
oauth_authorize_url: ''
oauth_token_url: ''
oauth_scopes: ''
oauth_scope_separator: ''
oauth_refresh_url: ''
oauth_auth_params: ''
oauth_token_headers: ''
oauth_token_site: ''
oauth_token_params: ''
oauth_token_request_auth_method: ''
oauth_body_format: ''
oauth_token_response_metadata: ''
oauth_authorization_method: ''
oauth_refresh_params: ''
oauth_token_field_name: ''
oauth_expiry_field_name: ''
oauth_expiry_strategy: ''
oauth_fixed_expiry_ms: ''
custom_fields:
- keyname: tomtom_api_key
  field_type: password
  name: TomTom API Key
  description: Free key from <a href="https://developer.tomtom.com/">developer.tomtom.com</a>
- keyname: origin
  field_type: lat_lon
  name: Origin
  description: lat,lng (ex. 38.707530,-9.136378)
- keyname: destination
  field_type: lat_lon
  name: Destination
  description: lat,lng (ex. 41.148836,-8.610915)
- keyname: return_trip
  field_type: boolean
  name: Return Trip?
  description: Swaps origin and destination, for the trip home
  default: false
- keyname: arrive_by
  field_type: string
  name: Arrive by
  optional: true
  placeholder: '09:00'
  description: HH:mm (24h), later today
  help_text: Leave empty to show the trip if you leave now. When set, the screen shows what time to leave instead, interpreted in the destination's local time.
- keyname: route_label
  field_type: string
  name: Route Label
  description: Title on screen
  default: Commute
- keyname: language
  field_type: select
  name: Language
  options:
  - English: en
  - Português: pt
  default: en
- keyname: about_plugin
  name: About this plugin
  field_type: author_bio
  category: productivity,travel
  description: Car commute times via <a href="https://developer.tomtom.com/">TomTom Routing</a>, by Diogo Loureiro. Set origin and destination as <code>lat,lng</code>. Leave <code>Arrive by</code> empty for live travel time, or set a time to see when to leave. Turn on <code>Return Trip?</code> for the way home.
  github_url: https://github.com/dfloureiro/TRMNL-plugins/tree/main/plugins/TomTom-Commute
  email_address: dfl.accounts+trmnl@mailbox.org
  learn_more_url: https://developer.tomtom.com/routing-api/documentation/tomtom-maps/v1/calculate-route
name: TomTom Commute
description: Live travel and leave-by times
refresh_interval: 15
