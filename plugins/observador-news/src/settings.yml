---
strategy: polling
no_screen_padding: 'no'
dark_mode: 'no'
static_data: ''
polling_verb: get
framework_version: 3.4.6
serverless_language: node
refresh_interval_floor: ''
polling_url: https://observador.pt/rss/ultimas/
polling_headers: ''
polling_body: ''
id: 543130
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
custom_fields:
- keyname: section
  field_type: select
  name: Section
  description: Show only articles tagged with this section
  description-pt: Mostrar apenas artigos desta secção
  default: all
  options:
  - Últimas (all): all
  - Política: Política
  - País: País
  - Sociedade: Sociedade
  - Economia: Economia
  - Mundo: Mundo
  - Desporto: Desporto
  - Cultura: Cultura
  - Ciência: Ciência
  - Tecnologia: Tecnologia
  - Lifestyle: Lifestyle
  help_text: Observador publishes a single latest-news feed, so sections are filtered from each article's tags. Quieter sections may show only a few articles.
- keyname: hide_programs
  field_type: boolean
  name: Hide radio and podcasts
  description: Leave out Rádio Observador newscasts and programmes
  default: true
- keyname: language
  field_type: select
  name: Language
  description: Screen language (labels and times; headlines are always in Portuguese)
  default: pt
  options:
  - English: en
  - Português: pt
  help_text: Pick your preferred language
- keyname: about_plugin
  name: About this plugin
  field_type: author_bio
  category: news
  description: Latest headlines from <a href="https://observador.pt/">Observador</a>, read from its public RSS feed, with an optional section filter. By Diogo Loureiro. Not affiliated with Observador.
  github_url: https://github.com/dfloureiro/TRMNL-plugins/tree/main/plugins/observador-news
  learn_more_url: https://observador.pt/
  email_address: dfl.accounts+trmnl@mailbox.org
name: Observador - Notícias
description: Latest news from Observador (PT)
refresh_interval: 30
