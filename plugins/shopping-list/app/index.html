<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151515" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Shopping">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Shopping list</title>
<!--
  Shopping list for TRMNL. Everything you type stays in this browser (localStorage) and is sent
  only to the TRMNL webhook URL you enter in Settings. The page itself contains no data.
-->
<style>
  :root {
    --bg: #f6f5f2; --card: #ffffff; --ink: #151515; --muted: #6b6b6b; --line: #e3e1dc;
    --accent: #151515; --on-accent: #ffffff; --danger: #c0362c; --ok: #2f7d4f; --warn: #a86400;
    --radius: 14px;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151515; --card: #1f1f1f; --ink: #f1f0ec; --muted: #9a9a9a; --line: #2e2e2e;
            --accent: #f1f0ec; --on-accent: #151515; --danger: #ff6b5e; --ok: #5fc48a; --warn: #f0a640; }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: env(safe-area-inset-top) 0 calc(110px + env(safe-area-inset-bottom));
  }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
  button:disabled { cursor: default; opacity: 0.35; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px; }

  header { display: flex; align-items: center; gap: 12px; padding: 18px 0 10px; }
  header h1 { font-size: 28px; margin: 0; flex: 1; letter-spacing: -0.02em; }
  .icon-btn { border: 0; background: transparent; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; flex: none; }
  .icon-btn:active { background: var(--line); }
  .icon-btn svg { width: 24px; height: 24px; }

  .status { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); min-height: 28px; margin-bottom: 8px; }
  .status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
  .status[data-kind="ok"] .dot { background: var(--ok); }
  .status[data-kind="busy"] .dot { background: var(--warn); }
  .status[data-kind="error"] { color: var(--danger); }
  .status[data-kind="error"] .dot { background: var(--danger); }
  .status button { margin-left: auto; border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 2px 12px; font-size: 14px; }

  /* The list is one card with a row per item. */
  .list { padding: 0; margin: 0; list-style: none; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); }
  .list:empty { display: none; }
  .item { display: flex; align-items: center; gap: 4px; padding: 4px 8px 4px 4px; min-height: 56px; background: var(--card); }
  .item + .item { border-top: 1px solid var(--line); }
  .item:first-child { border-radius: var(--radius) var(--radius) 0 0; }
  .item:last-child { border-radius: 0 0 var(--radius) var(--radius); }
  .item:only-child { border-radius: var(--radius); }
  .handle { flex: none; border: 0; background: none; color: var(--muted); width: 28px; height: 44px; display: grid; place-items: center;
            touch-action: none; cursor: grab; border-radius: 8px; -webkit-touch-callout: none; user-select: none; -webkit-user-select: none; }
  .handle svg { width: 18px; height: 18px; }
  .item.dragging { position: relative; z-index: 5; box-shadow: 0 10px 28px rgb(0 0 0 / 0.22); border-radius: 10px; transition: none !important; }
  .list.sorting { user-select: none; -webkit-user-select: none; }
  .list.sorting .item:not(.dragging) { transition: transform 0.15s; }
  .check { flex: none; width: 44px; height: 44px; border: 0; background: none; display: grid; place-items: center; border-radius: 50%; }
  .check span { width: 26px; height: 26px; border: 2px solid var(--muted); border-radius: 50%; display: grid; place-items: center; transition: background 0.15s, border-color 0.15s; }
  .check svg { width: 16px; height: 16px; opacity: 0; color: var(--on-accent); }
  .item.done .check span { background: var(--ok); border-color: var(--ok); }
  .item.done .check svg { opacity: 1; }
  .item.done .name { text-decoration: line-through; color: var(--muted); }
  .item.done { transition: opacity 0.3s 0.15s; opacity: 0.4; }
  .name { flex: 1; min-width: 0; border: 0; background: none; text-align: left; padding: 8px 4px; font-size: 17px; overflow-wrap: anywhere; }
  .stepper { flex: none; display: flex; align-items: center; gap: 2px; }
  .stepper button { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: var(--bg); display: grid; place-items: center; padding: 0; }
  .stepper button svg { width: 16px; height: 16px; }
  .stepper output { min-width: 30px; text-align: center; font-weight: 600; font-variant-numeric: tabular-nums; }
  .stepper output.many { background: var(--accent); color: var(--on-accent); border-radius: 8px; padding: 1px 6px; min-width: 26px; margin: 0 2px; }

  .empty { text-align: center; color: var(--muted); padding: 48px 16px; }
  .empty svg { width: 56px; height: 56px; opacity: 0.6; }
  .setup { background: var(--card); border: 1px dashed var(--muted); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; }
  .setup h2 { margin: 0 0 10px; font-size: 18px; }
  .setup ol { margin: 0 0 12px; padding-left: 22px; }
  .setup li { margin-bottom: 4px; }
  .setup .connect { display: flex; gap: 8px; }
  .setup .connect input { flex: 1; min-width: 0; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); font-size: 16px; }
  .setup .small { font-size: 13px; color: var(--muted); margin: 10px 0 0; }
  .setup .small.err { color: var(--danger); }

  /* Add bar, fixed at the bottom */
  .bar { position: fixed; left: 0; right: 0; bottom: 0; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
         border-top: 1px solid var(--line); padding: 10px 0 calc(10px + env(safe-area-inset-bottom)); z-index: 10; }
  .bar .wrap { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .bar button { border: 1px solid var(--line); background: var(--card); border-radius: 14px; padding: 8px 4px; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 14px; font-weight: 600; }
  .bar button svg { width: 24px; height: 24px; }
  .bar button.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  .bar button:active { opacity: 0.7; }

  dialog { border: 0; padding: 0; width: min(560px, 100%); max-width: 100%; margin: auto auto 0; background: var(--card); color: var(--ink);
           border-radius: 20px 20px 0 0; max-height: 92vh; }
  dialog::backdrop { background: rgb(0 0 0 / 0.4); }
  @media (min-width: 600px) { dialog { margin: auto; border-radius: 20px; } }
  .sheet { padding: 20px 16px calc(20px + env(safe-area-inset-bottom)); }
  .sheet h2 { margin: 0 0 14px; font-size: 20px; }
  .field { display: block; margin-bottom: 14px; }
  .field > span { display: block; font-size: 14px; color: var(--muted); margin-bottom: 4px; }
  .field input { width: 100%; padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); font-size: 17px; }
  .field input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .field .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  .qty-field { display: flex; align-items: center; gap: 10px; }
  .qty-field input { width: 80px; text-align: center; font-variant-numeric: tabular-nums; }
  .qty-field button { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--bg); display: grid; place-items: center; padding: 0; }
  .qty-field button svg { width: 18px; height: 18px; }
  .hint { font-size: 13px; color: var(--muted); margin: -8px 0 14px; }
  .hint.err { color: var(--danger); }
  .hint a { color: inherit; }
  .buttons { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; flex-wrap: wrap; align-items: center; }
  .buttons .left { margin-right: auto; }
  .btn { border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 10px 16px; }
  .btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 600; }
  .btn.danger { color: var(--danger); }
  .group { border-top: 1px solid var(--line); padding-top: 16px; margin-top: 18px; }
  .group h3 { font-size: 15px; margin: 0 0 8px; }
  textarea { width: 100%; min-height: 100px; padding: 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); font: 13px ui-monospace, Menlo, monospace; }
  #bulkText { min-height: 40vh; font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .steps { margin: 0 0 10px; padding-left: 22px; font-size: 15px; }
  .steps li { margin-bottom: 2px; }
  .sheet-hint { font-size: 14px; color: var(--muted); margin: -6px 0 12px; }
  /* The photo is only shown, so the phone's own text selection (Live Text) can copy from it. */
  /* Keep the whole photo in view with no scrolling box around it: iOS only offers Live Text on an
     image it can see whole (inside a scrolling box it shows the plain image menu instead). */
  .photo { margin: 0 0 12px; }
  .photo img { display: block; max-width: 100%; max-height: calc(100vh - 290px); margin: 0 auto; border-radius: 10px; -webkit-user-select: auto; user-select: auto; -webkit-touch-callout: default; }

  .toast { position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--ink); color: var(--bg);
           padding: 10px 16px; border-radius: 999px; font-size: 15px; display: flex; gap: 14px; align-items: center; box-shadow: 0 6px 20px rgb(0 0 0 / 0.25);
           max-width: calc(100% - 32px); z-index: 20; }
  .toast[hidden] { display: none; }
  .toast button { border: 0; background: none; color: inherit; font-weight: 700; text-decoration: underline; padding: 0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title">Shopping list</h1>
    <button class="icon-btn" id="settingsBtn" aria-label="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </header>
  <div class="status" id="status" role="status" aria-live="polite"><span class="dot"></span><span id="statusText"></span></div>
  <form id="setup" class="setup" hidden autocomplete="off">
    <h2 id="setupTitle"></h2>
    <ol><li id="setupStep1"></li><li id="setupStep2"></li><li id="setupStep3"></li></ol>
    <div class="connect">
      <input id="setupUrl" type="url" inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="https://trmnl.com/api/custom_plugins/…" aria-labelledby="setupStep3">
      <button type="submit" class="btn primary" id="setupBtn"></button>
    </div>
    <p class="small" id="setupHint"></p>
  </form>
  <ul class="list" id="list"></ul>
  <div class="empty" id="empty" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 8h15l-1.2 12.5h-12.6z"/><path d="M8.5 11V7a3.5 3.5 0 0 1 7 0v4"/></svg>
    <p id="emptyText"></p>
  </div>
</div>

<div class="bar">
  <div class="wrap">
    <button type="button" id="photoBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.5" r="3.5"/></svg><span id="photoBtnL"></span></button>
    <button type="button" id="pasteBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="12" height="17" rx="2"/><path d="M9 4.5V3h6v1.5M9 10h6M9 13.5h6M9 17h4"/></svg><span id="pasteBtnL"></span></button>
    <button type="button" class="primary" id="addBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span id="addBtnL"></span></button>
  </div>
</div>
<input type="file" id="photoInput" accept="image/*" hidden>
<datalist id="history"></datalist>

<dialog id="editDialog">
  <form class="sheet" id="editForm" method="dialog" autocomplete="off">
    <h2 id="editTitle"></h2>
    <label class="field"><span id="fNameL"></span><input id="fName" list="history" maxlength="60" enterkeyhint="done" autocapitalize="sentences"></label>
    <div class="field"><span id="fQtyL"></span>
      <div class="qty-field">
        <button type="button" id="fMinus" aria-label="−"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
        <input id="fQty" type="number" inputmode="numeric" min="1" max="999" step="1">
        <button type="button" id="fPlus" aria-label="+"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
      </div>
    </div>
    <p class="hint err" id="editErr" hidden></p>
    <div class="buttons">
      <button type="button" class="btn danger left" id="editDelete"></button>
      <button type="button" class="btn" id="editCancel"></button>
      <button type="submit" class="btn primary" id="editSave"></button>
    </div>
  </form>
</dialog>

<dialog id="bulkDialog">
  <form class="sheet" id="bulkForm" method="dialog">
    <h2 id="bulkTitle"></h2>
    <p class="sheet-hint" id="bulkHint"></p>
    <textarea id="bulkText" autocapitalize="sentences"></textarea>
    <p class="hint err" id="bulkErr" hidden style="margin:8px 0 0"></p>
    <div class="buttons">
      <button type="button" class="btn" id="bulkCancel"></button>
      <button type="submit" class="btn primary" id="bulkAdd"></button>
    </div>
  </form>
</dialog>

<dialog id="photoDialog">
  <form class="sheet" method="dialog">
    <h2 id="photoTitle"></h2>
    <ol class="steps" id="photoSteps"></ol>
    <figure class="photo"><img id="photoImg" alt=""></figure>
    <div class="buttons">
      <button type="button" class="btn" id="photoClose"></button>
      <button type="button" class="btn primary" id="photoPaste"></button>
    </div>
  </form>
</dialog>

<dialog id="settingsDialog">
  <form class="sheet" id="settingsForm" method="dialog" autocomplete="off">
    <h2 id="sTitle"></h2>
    <label class="field"><span id="sUrlL"></span><input id="sUrl" type="url" inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="https://trmnl.com/api/custom_plugins/…"></label>
    <p class="hint" id="sUrlHint"></p>
    <div class="buttons">
      <button type="button" class="btn" id="sSend"></button>
      <button type="submit" class="btn primary" id="sSave"></button>
    </div>
    <div class="group">
      <h3 id="bTitle"></h3>
      <p class="hint" id="bHint" style="margin:0 0 10px"></p>
      <div class="buttons" style="justify-content:flex-start">
        <button type="button" class="btn" id="bExport"></button>
        <button type="button" class="btn" id="bImport"></button>
      </div>
      <div id="importBox" hidden style="margin-top:10px">
        <textarea id="importText" spellcheck="false"></textarea>
        <div class="buttons"><button type="button" class="btn primary" id="bImportGo"></button></div>
      </div>
    </div>
    <div class="group">
      <p class="hint" id="sizeHint" style="margin:0"></p>
    </div>
    <div class="buttons"><button type="button" class="btn" id="sClose"></button></div>
  </form>
</dialog>

<div class="toast" id="toast" hidden><span id="toastText"></span><button id="toastAction" hidden></button></div>

<script>
"use strict";
(function () {
  // ---------- Text ----------
  var IOS = /iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

      bulkAdd: function (n) { return n ? "Adicionar " + n : "Adicionar"; }, bulkNone: "Ainda não há nada para adicionar.",

  var LANG = /^pt/i.test(navigator.language || "") ? "pt" : "en";
  var T = STRINGS[LANG];
  document.documentElement.lang = LANG;

  // ---------- Storage ----------
  var KEY = "trmnl-shopping:v1";
  var state = { items: [], history: [], updatedAt: 0, dirty: false, sentAt: 0, webhook: "" };
  try {
    var saved = JSON.parse(localStorage.getItem(KEY) || "null");
    if (saved && Array.isArray(saved.items)) state = Object.assign(state, saved);
  } catch (e) { /* storage unavailable: start empty */ }

  // ---------- Helpers ----------
  var $ = function (id) { return document.getElementById(id); };
  function newKey() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
  function clean(s) { return String(s || "").replace(/\s+/g, " ").trim(); }
  function norm(s) { return clean(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, ""); }
  function clampQty(n) { n = Math.round(Number(n)); return isFinite(n) && n >= 1 ? Math.min(n, 999) : 1; }
  function capital(s) { return s ? s.charAt(0).toLocaleUpperCase(LANG) + s.slice(1) : s; }
  function fmtTime(ms) {
    return new Date(ms).toLocaleString(LANG === "pt" ? "pt-PT" : undefined, { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
  }
  function isWebhook(url) { return /^https:\/\/(use)?trmnl\.com\/api\/custom_plugins\/[0-9a-f-]{8,}\/?$/i.test(url); }
  function payload() {
    // qty is left out when it is 1, to stay well inside TRMNL's size limit.
    var items = state.items.map(function (it) { return it.qty > 1 ? { name: it.name, qty: it.qty } : { name: it.name }; });
    // v: payload format version. Version 1 is documented in the README; keep it backwards compatible.
    return { merge_variables: { v: 1, items: items, updated: fmtTime(state.updatedAt || Date.now()), updated_at: state.updatedAt } };
  }
  function payloadBytes() { return new Blob([JSON.stringify(payload())]).size; }
  function fromRemote(list) {
    return list.map(function (it) { return { k: newKey(), name: clean(it && it.name).slice(0, 60), qty: clampQty(it && it.qty) }; })
      .filter(function (it) { return it.name; });
  }

  var toastTimer, toastDone;
  function toast(text, actionLabel, action, onHide) {
    $("toastText").textContent = text;
    var btn = $("toastAction");
    btn.hidden = !actionLabel;
    btn.textContent = actionLabel || "";
    btn.onclick = function () { hideToast(); if (action) action(); };
    $("toast").hidden = false;
    clearTimeout(toastTimer);
    if (toastDone) { var f = toastDone; toastDone = null; f(); }
    toastDone = onHide || null;
    toastTimer = setTimeout(hideToast, actionLabel ? 6000 : 2200);
  }
  function hideToast() {
    $("toast").hidden = true;
    clearTimeout(toastTimer);

  }

  // ---------- Reading a written list ----------
  // Turns free text (typed, pasted or scanned) into items. One item per line;
  // a line can also hold several items separated by ";" or by "," (but "Chicken, 1 kg" stays whole).
  // Quantities: "2 milk", "2x milk", "2 × milk", "milk x2", "milk ×2", "milk (2)", "milk - 2", "eggs 12".
  // "500 g flour" and "flour 1 kg" keep the amount in the name.
  var UNIT = "(?:k?g|mg|kgs?|gr|grams?|gramas?|l|ml|cl|dl|lt|lts|litros?|litres?|liters?|lbs?|oz|cm|m|mm|%)";
  var reUnitStart = new RegExp("^\\d+(?:[.,]\\d+)?\\s*" + UNIT + "\\b", "i");
  var reUnitEnd = new RegExp("\\d+(?:[.,]\\d+)?\\s*" + UNIT + "\\.?$", "i");
  var reSplit = new RegExp(",(?!\\s*\\d+(?:[.,]\\d+)?\\s*" + UNIT + "\\b)", "i");
  function parseLine(line) {
    var s = clean(line)
      .replace(/^(?:\[\s?[xX✓✔]?\s?\]|[-*•·◦▪▫■□☐☑☒✓✔○●◯–—>]+)\s*/, "") // bullets and checkboxes
      .replace(/^\d{1,2}[.)]\s+/, "");                                     // "1. milk", "2) eggs": numbering
    if (!s || !/\p{L}/u.test(s)) return null;
    var qty = 1, m;
    if ((m = s.match(/^(\d{1,3})\s*[x×*]\s*(.+)$/i)) && !reUnitStart.test(s)) { qty = +m[1]; s = m[2]; }
    else if ((m = s.match(/^(\d{1,3})\s+(.+)$/)) && !reUnitStart.test(s)) { qty = +m[1]; s = m[2]; }
    else if ((m = s.match(/^(.+?)\s*(?:[x×*]\s*(\d{1,3})|\((\d{1,3})\)|[-–:]\s*(\d{1,3}))$/i))) { qty = +(m[2] || m[3] || m[4]); s = m[1]; }
    else if ((m = s.match(/^(.+?)\s+(\d{1,3})$/)) && !reUnitEnd.test(s)) { qty = +m[2]; s = m[1]; }
    s = clean(s.replace(/^[-–:,.]\s*|\s*[-–:,]$/g, ""));
    if (!s || !/\p{L}/u.test(s)) return null;
    return { name: capital(s).slice(0, 60), qty: clampQty(qty) };
  }
  function parseList(text) {
    var out = [];
    String(text || "").split(/\r?\n|;/).forEach(function (line) {
      line.split(reSplit).forEach(function (part) {
        var it = parseLine(part);
        if (!it) return;
        // The same item twice in one list adds up.
        var same = out.find(function (o) { return norm(o.name) === norm(it.name); });
        if (same) same.qty = clampQty(same.qty + it.qty); else out.push(it);
      });
    });
    return out;
  }

  // Adds items to the list. An item already on it gets its quantity increased instead.
  function addItems(list) {
    var added = 0, merged = 0;
    list.forEach(function (it) {
      var same = state.items.find(function (o) { return norm(o.name) === norm(it.name); });
      if (same) { same.qty = clampQty(same.qty + it.qty); merged++; }
      else { state.items.push({ k: newKey(), name: it.name, qty: it.qty }); added++; }
      remember(it.name);
    });
    if (added || merged) changed();
    return { added: added, merged: merged };
  }
  // Names used before, offered as suggestions while typing. Stays on this device.
  function remember(name) {
    var n = norm(name);
    state.history = [name].concat((state.history || []).filter(function (h) { return norm(h) !== n; })).slice(0, 300);
  }
  function renderHistory() {
    var dl = $("history"); dl.textContent = "";
    (state.history || []).forEach(function (h) { var o = document.createElement("option"); o.value = h; dl.appendChild(o); });
  }

  // ---------- Sync with TRMNL ----------
  var pushTimer, busy = false, lastError = "";
  function changed() {
    state.updatedAt = Date.now();
    state.dirty = true;
    lastError = "";

    render();
    clearTimeout(pushTimer);
    // A pause groups quick edits (ticking items off one after another, undo) into one update,
    // as TRMNL limits updates per hour.
    pushTimer = setTimeout(push, 4000);
  }

  function push() {
    clearTimeout(pushTimer);
    if (!state.webhook || busy) { renderStatus(); return; }
    if (!navigator.onLine) { lastError = T.offline; renderStatus(); return; }
    busy = true; renderStatus();
    var sentVersion = state.updatedAt;
    fetch(state.webhook, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload()), referrerPolicy: "no-referrer" })
      .then(function (res) {
        if (res.ok) return null;
        return res.text().then(function (body) {
          var msg = "";
          try { msg = JSON.parse(body).message || JSON.parse(body).error || ""; } catch (e) { msg = body.slice(0, 160); }
          if (res.status === 429) return T.tooMany;
          if (res.status === 413) return T.tooBig;
          return "HTTP " + res.status + (msg ? " – " + msg : "");
        });
      })
      .then(function (err) {

        if (err) { lastError = err; }

      });
  }

  // TRMNL answers a GET on the webhook URL with the data it holds. If that data is newer than
  // this browser's copy (for example after Safari cleared storage, or edits from another
  // device), use it. If the request fails, nothing changes.
  // force: compare even with unsent local edits (used right after the URL is entered).
  function pull(force) {
    if (!state.webhook || (state.dirty && !force) || !navigator.onLine) return Promise.resolve();
    return fetch(state.webhook, { method: "GET", headers: { Accept: "application/json" }, referrerPolicy: "no-referrer" })
      .then(function (res) { return res.ok ? res.json() : null; })
      .then(function (j) {

        var mv = j.merge_variables || (j.data && j.data.merge_variables) || j.data || j;
        if (!mv || !Array.isArray(mv.items)) return;
        var remoteAt = Number(mv.updated_at) || 0;
        if (remoteAt <= state.updatedAt) return;
        state.items = fromRemote(mv.items);
        state.updatedAt = remoteAt;
        state.sentAt = remoteAt;
        state.dirty = false;
        persist(); render(); toast(T.restored);
      })
      .catch(function () {});
  }

  // ---------- Rendering ----------
  function renderStatus() {

    var old = el.querySelector("button"); if (old) old.remove();
    var kind = "", msg = "";

    else if (busy) { kind = "busy"; msg = T.sending; }
    else if (lastError) { kind = "error"; msg = T.failed(lastError); }
    else if (state.dirty) { kind = "busy"; msg = T.pending; }
    else if (state.sentAt) { kind = "ok"; msg = T.sentAt(fmtTime(state.sentAt)); }
    el.dataset.kind = kind;
    text.textContent = msg;

  }

  var ICON_MINUS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M5 12h14"/></svg>';
  var ICON_PLUS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>';
  var ICON_CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  var ICON_GRIP = '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg>';

      li.className = "item";
      li.dataset.k = it.k;
      if (ticking[it.k]) li.classList.add("done");

      minus.onclick = function () { setQty(it.k, it.qty - 1); };

  // ---------- Reorder ----------
  // Drag a row by its handle. Nothing is moved in the page while the finger is down (iOS stops
  // sending touch events if the touched element is moved): the dragged row and the rows it
  // passes are only shifted with transforms. The new order is applied on release.
  var drag = null;
  function startDrag(ev) {
    if (drag || (ev.pointerType === "mouse" && ev.button !== 0)) return;
    ev.preventDefault();
    var li = ev.currentTarget.closest(".item");
    var cards = Array.prototype.slice.call($("list").children);
    var from = cards.indexOf(li);
    var tops = cards.map(function (c) { return c.offsetTop; });
    var heights = cards.map(function (c) { return c.offsetHeight; });
    var gap = cards.length > 1 ? tops[1] - tops[0] - heights[0] : 0;
    drag = { li: li, cards: cards, from: from, to: from, tops: tops, heights: heights, step: heights[from] + gap,

    top = Math.max(lo, Math.min(hi, top));

    // Target index: how many of the other rows have their middle above the dragged row's middle.
    var to = 0;
    for (var k = 0; k < d.cards.length; k++) {
      if (k !== d.from && d.tops[k] + d.heights[k] / 2 < centre) to++;
    }
    d.to = to;
    for (var j = 0; j < d.cards.length; j++) {
      if (j === d.from) continue;
      var shift = 0;
      if (d.from < to && j > d.from && j <= to) shift = -d.step;
      if (d.from > to && j >= to && j < d.from) shift = d.step;

    window.removeEventListener("pointercancel", endDrag);

    d.cards.forEach(function (c) { c.style.transform = ""; c.classList.remove("dragging"); });
    if (d.to !== d.from) {

  // ---------- Item actions ----------
  function indexOfKey(k) { return state.items.findIndex(function (it) { return it.k === k; }); }

    var i = indexOfKey(k); if (i < 0) return;

  // Ticking an item off shows it checked for a moment, then removes it. Items ticked off in a row
  // share one Undo, which puts them all back where they were.
  var ticking = {}, undoBatch = [];
  function tick(k) {
    if (ticking[k]) return;
    ticking[k] = true;
    var li = $("list").querySelector('[data-k="' + k + '"]');
    if (li) li.classList.add("done");
    setTimeout(function () {
      delete ticking[k];
      var i = indexOfKey(k); if (i < 0) return;
      var gone = state.items.splice(i, 1)[0];
      undoBatch.push({ item: gone, at: i });
      changed();
      var batch = undoBatch;
      toast(T.ticked(batch.length, gone.name), T.undo, function () { restore(batch); }, function () { if (undoBatch === batch) undoBatch = []; });
    }, 450);
  }
  function restore(batch) {
    for (var j = batch.length - 1; j >= 0; j--) {
      state.items.splice(Math.min(batch[j].at, state.items.length), 0, batch[j].item);
    }
    undoBatch = [];
    changed();
  }

  // k: the item to edit, or null for a new item.
  var editingKey = null;
  function openEdit(k) {
    var i = k === null ? -1 : indexOfKey(k);
    if (k !== null && i < 0) return;
    editingKey = k;
    $("editTitle").textContent = k === null ? T.newItem : T.edit;
    $("editSave").textContent = k === null ? T.add : T.save;
    $("editDelete").hidden = k === null;
    $("fName").value = i >= 0 ? state.items[i].name : "";
    $("fQty").value = i >= 0 ? state.items[i].qty : 1;
    $("editErr").hidden = true;
    $("editDialog").showModal();
    if (k === null) $("fName").focus();
  }
  $("fMinus").onclick = function () { $("fQty").value = clampQty((+$("fQty").value || 1) - 1); };
  $("fPlus").onclick = function () { $("fQty").value = clampQty((+$("fQty").value || 0) + 1); };
  $("editForm").addEventListener("submit", function (ev) {
    var name = clean($("fName").value).slice(0, 60);
    if (!name) { ev.preventDefault(); $("editErr").textContent = T.needName; $("editErr").hidden = false; return; }
    if (editingKey === null) {
      // A new item already on the list adds to its quantity.
      var r = addItems([{ name: capital(name), qty: clampQty($("fQty").value) }]);
      renderHistory();
      if (r.merged) toast(T.added(0, 1));
      setTimeout(function () { window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" }); }, 50);
      return;
    }
    var i = indexOfKey(editingKey); if (i < 0) return;
    state.items[i].name = name;
    state.items[i].qty = clampQty($("fQty").value);
    remember(name);
    changed();
  });
  $("editCancel").onclick = function () { $("editDialog").close(); };
  $("editDelete").onclick = function () {
    var i = indexOfKey(editingKey);
    $("editDialog").close();
    if (i < 0) return;
    var gone = state.items.splice(i, 1)[0];
    changed();
    toast(T.removed + ": " + gone.name, T.undo, function () { restore([{ item: gone, at: i }]); });
  };

  // ---------- Paste a list, or copy it from a photo ----------
  // Phones read text (handwriting included) far better than anything a web page can run, but a
  // page can't call their text scanners. So the app shows the photo, the phone's own text
  // selection copies the list from it, and Paste turns the copied text into a tidy list to check.

  // Lines that are a list's heading, not something to buy.
  var HEADING = /^(shopping( list)?|grocer(y|ies)( list)?|to buy|list|lista( de compras)?|compras|supermercado|mercado)\s*:?$/i;
  // Tidies copied text into one item per line, with quantities written the same way.
  function formatList(text) {
    var lines = String(text || "").split(/\r?\n/).filter(function (l) { return !HEADING.test(clean(l)); });
    return parseList(lines.join("\n")).map(function (it) { return it.qty > 1 ? it.qty + " × " + it.name : it.name; }).join("\n");
  }
  function openCheck(text) {
    var box = $("bulkText");
    var tidy = formatList(text);
    box.value = box.value.trim() && $("bulkDialog").open ? box.value.replace(/\s*$/, "\n") + tidy : tidy;
    $("bulkErr").hidden = true;
    countCheck();
    if (!$("bulkDialog").open) $("bulkDialog").showModal();
  }
  function countCheck() { $("bulkAdd").textContent = T.bulkAdd(parseList($("bulkText").value).length); }
  $("bulkText").addEventListener("input", function () { $("bulkErr").hidden = true; countCheck(); });
  $("bulkForm").addEventListener("submit", function (ev) {
    var list = parseList($("bulkText").value);
    if (!list.length) { ev.preventDefault(); $("bulkErr").textContent = T.bulkNone; $("bulkErr").hidden = false; return; }
    var r = addItems(list);
    renderHistory();
    $("bulkText").value = "";
    toast(T.added(r.added, r.merged));
  });
  $("bulkCancel").onclick = function () { $("bulkDialog").close(); };

  // Reading the clipboard needs https (the published app). Where it isn't allowed or is refused,
  // the check sheet opens empty and says how to paste into the box by hand.
  var canPaste = !!(navigator.clipboard && navigator.clipboard.readText && window.isSecureContext);
  function pasteByHand() {
    $("bulkText").value = "";
    openCheck("");
    $("bulkText").focus();
    toast(T.pasteHold);
  }
  function paste() {
    if (!canPaste) { pasteByHand(); return; }
    navigator.clipboard.readText().then(function (text) {
      if (!clean(text)) { toast(T.pasteFailed); return; }
      if ($("photoDialog").open) $("photoDialog").close();
      openCheck(text);
    }, pasteByHand);
  }
  $("pasteBtn").onclick = paste;
  $("photoPaste").onclick = function () {
    if (!canPaste) { $("photoDialog").close(); pasteByHand(); return; }
    paste();
  };

  // Photo: shown only on this phone, never uploaded; dropped when its sheet closes.
  var photoUrl = "";
  $("photoBtn").onclick = function () { $("photoInput").click(); };
  $("photoInput").addEventListener("change", function () {
    var file = this.files && this.files[0];
    this.value = "";
    if (!file) return;
    if (photoUrl) URL.revokeObjectURL(photoUrl);
    photoUrl = URL.createObjectURL(file);
    $("photoImg").src = photoUrl;
    var steps = $("photoSteps"); steps.textContent = "";
    (IOS ? T.photoIos : ANDROID ? T.photoAndroid : T.photoOther).forEach(function (s) {
      var li = document.createElement("li"); li.textContent = s; steps.appendChild(li);
    });
    $("photoDialog").showModal();
  });
  $("photoDialog").addEventListener("close", function () {
    if (photoUrl) URL.revokeObjectURL(photoUrl);
    photoUrl = ""; $("photoImg").removeAttribute("src");
  });
  $("photoClose").onclick = function () { $("photoDialog").close(); };

  $("addBtn").onclick = function () { openEdit(null); };

  // ---------- Settings ----------
  function openSettings() {
    $("sUrl").value = state.webhook;
    urlHint();
    $("importBox").hidden = true;
    $("sizeHint").textContent = T.size(payloadBytes());
    $("settingsDialog").showModal();
  }
  function urlHint() {
    var v = $("sUrl").value.trim();
    var bad = v && !isWebhook(v) && !(location.protocol === "http:" && /\/hook$/.test(v));
    $("sUrlHint").textContent = bad ? T.urlBad : T.urlHint;
    $("sUrlHint").classList.toggle("err", !!bad);
  }
  $("sUrl").addEventListener("input", urlHint);
  function urlAllowed(v) {
    // https only, except when the app itself runs over http (the local test server, see serve-app).
    return !v || /^https:\/\//i.test(v) || (location.protocol === "http:" && /^http:\/\//i.test(v));
  }
  function saveUrl(v) {
    v = (v === undefined ? $("sUrl").value : v).trim();
    if (!urlAllowed(v)) { urlHint(); return false; }
    if (v !== state.webhook) {
      state.webhook = v; lastError = "";
      // Only a list that was actually edited here counts as unsent; an empty new browser must
      // not wipe what TRMNL already shows.
      state.dirty = !!v && state.updatedAt > 0;
      persist();
    }
    return true;
  }
  $("settingsForm").addEventListener("submit", function (ev) {
    if (!saveUrl()) { ev.preventDefault(); return; }
    render();
    if (state.webhook) pull(true).then(function () { if (state.dirty) push(); });
  });
  $("sSend").onclick = function () { if (saveUrl()) { $("settingsDialog").close(); render(); push(); } };
  $("setup").addEventListener("submit", function (ev) {
    ev.preventDefault();
    var v = $("setupUrl").value.trim();
    var hint = $("setupHint");
    if (!v || !urlAllowed(v) || !(isWebhook(v) || location.protocol === "http:")) {
      hint.textContent = T.urlBad; hint.classList.add("err"); return;
    }
    hint.textContent = T.setupHint; hint.classList.remove("err");
    saveUrl(v);
    render();
    pull(true).then(function () { if (state.dirty) push(); });
  });
  $("sClose").onclick = function () { $("settingsDialog").close(); };

  $("bExport").onclick = function () {
    var data = JSON.stringify({ app: "trmnl-shopping", v: 1, updatedAt: state.updatedAt, items: state.items.map(function (it) { return { name: it.name, qty: it.qty }; }) });
    if (navigator.share && (IOS || ANDROID)) {
      navigator.share({ title: T.title + " backup", text: data }).catch(function () {});
    } else if (navigator.clipboard) {
      navigator.clipboard.writeText(data).then(function () { toast(T.exported); }, function () {});
    }
  };
  $("bImport").onclick = function () { $("importBox").hidden = false; $("importText").value = ""; $("importText").focus(); };
  $("bImportGo").onclick = function () {
    try {
      var j = JSON.parse($("importText").value);
      if (!j || j.app !== "trmnl-shopping" || !Array.isArray(j.items)) throw new Error();
      state.items = fromRemote(j.items);
      $("settingsDialog").close();
      changed();
      toast(T.imported);
    } catch (e) { toast(T.importBad); }
  };

  // ---------- Wire up ----------
  $("title").textContent = T.title;
  document.title = T.title;
  $("photoBtnL").textContent = T.photo;
  $("pasteBtnL").textContent = T.paste;
  $("addBtnL").textContent = T.addItem;
  $("settingsBtn").setAttribute("aria-label", T.settings);
  $("emptyText").textContent = T.empty;
  $("setupTitle").textContent = T.setupTitle;
  $("setupStep1").textContent = T.setupStep1;
  $("setupStep2").textContent = T.setupStep2;
  $("setupStep3").textContent = T.setupStep3;
  $("setupHint").textContent = T.setupHint;
  $("setupBtn").textContent = T.setupBtn;
  $("fNameL").textContent = T.name;
  $("fQtyL").textContent = T.qty;
  $("fMinus").setAttribute("aria-label", T.fewer);
  $("fPlus").setAttribute("aria-label", T.more);
  $("editCancel").textContent = T.cancel;
  $("editSave").textContent = T.save;
  $("editDelete").textContent = T.del;
  $("bulkTitle").textContent = T.bulk;
  $("bulkText").placeholder = T.bulkPh;
  $("bulkCancel").textContent = T.cancel;
  $("bulkHint").textContent = T.bulkHint;
  $("photoTitle").textContent = T.photoTitle;
  $("photoClose").textContent = T.close;
  $("photoPaste").textContent = T.paste;
  $("sTitle").textContent = T.settings;
  $("sUrlL").textContent = T.url;
  $("sSend").textContent = T.sendNow;
  $("sSave").textContent = T.save;
  $("sClose").textContent = T.close;
  $("bTitle").textContent = T.backup;
  $("bHint").textContent = T.backupHint;
  $("bExport").textContent = T.export;
  $("bImport").textContent = T.import;
  $("bImportGo").textContent = T.importGo;

  $("settingsBtn").onclick = openSettings;
  // Tapping the dimmed background closes a sheet.
  [$("editDialog"), $("bulkDialog"), $("photoDialog"), $("settingsDialog")].forEach(function (dlg) {
    dlg.addEventListener("click", function (ev) { if (ev.target === dlg) dlg.close(); });
  });

  window.addEventListener("online", function () { if (state.dirty) push(); else pull(); });
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible") { if (state.dirty) push(); else pull(); }
    // Leaving the app (phone locked in the shop) sends pending changes right away.
    else if (state.dirty && state.webhook) push();
  });

  // Text shared into the installed app (manifest share_target) arrives as ?text=… (or ?title=).
  // It opens the check sheet with that text, tidied into a list.
  (function () {
    var q = new URLSearchParams(location.search);
    var shared = [q.get("title"), q.get("text")].filter(function (s) { return s && s.trim(); }).join("\n");
    if (!q.has("text") && !q.has("title")) return;
    history.replaceState(null, "", location.pathname);
    if (shared) { $("bulkText").value = ""; openCheck(shared); }
  })();

  renderHistory();
  render();
  if (state.dirty) push(); else pull();
})();
</script>
</body>
</html>
