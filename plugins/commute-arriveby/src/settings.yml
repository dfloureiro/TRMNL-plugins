---
strategy: polling
no_screen_padding: 'no'
dark_mode: 'no'
static_data: ''
polling_verb: get
framework_version: 3.3.1
serverless_language: node
polling_url: https://httpbin.org/json
polling_headers: ''
polling_body: ''
id: 477902
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
oauth_authorize_url: ''
oauth_token_url: ''
oauth_scopes: ''
oauth_scope_separator: ''
oauth_refresh_url: ''
oauth_auth_params: ''
oauth_token_headers: ''
oauth_token_site: ''
oauth_token_params: ''
oauth_token_request_auth_method: ''
oauth_body_format: ''
oauth_token_response_metadata: ''
oauth_authorization_method: ''
oauth_refresh_params: ''
oauth_token_field_name: ''
oauth_expiry_field_name: ''
oauth_expiry_strategy: ''
oauth_fixed_expiry_ms: ''
custom_fields:
- keyname: tomtom_api_key
  field_type: password
  name: TomTom API Key
  description: Free key from <a href="https://developer.tomtom.com/">developer.tomtom.com</a>
- keyname: origin
  field_type: string
  name: Origin
  description: lat,lng (ex. 38.707530,-9.136378)
- keyname: destination
  field_type: string
  name: Destination
  description: lat,lng (ex. 41.148836,-8.610915)
- keyname: route_label
  field_type: string
  name: Route Label
  description: Title on top
  default: Commute
- keyname: language
  field_type: select
  name: Language
  options:
  - en
  - pt
  default: en
name: Commute - Arrive By
description: Check the ETA for your arrival
refresh_interval: 15
