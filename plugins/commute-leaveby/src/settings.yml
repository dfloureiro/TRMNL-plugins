---
strategy: polling
no_screen_padding: 'no'
dark_mode: 'no'
static_data: ''
polling_verb: get
framework_version: 3.3.1
serverless_language: node
polling_url: 'https://api.tomtom.com/routing/1/calculateRoute/{{ origin }}:{{ destination }}/json?key={{ tomtom_api_key }}&traffic=true&maxAlternatives=2&routeType=fastest&computeTravelTimeFor=all&sectionType=traffic&instructionsType=coded&travelMode=car&routeRepresentation=summaryOnly&arriveAt={{ "now" | date: "%Y-%m-%d" }}T{{ arrive_by }}:00'
polling_headers: ''
polling_body: ''
id: 478414
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
oauth_authorize_url: ''
oauth_token_url: ''
oauth_scopes: ''
oauth_scope_separator: ''
oauth_refresh_url: ''
oauth_auth_params: ''
oauth_token_headers: ''
oauth_token_site: ''
oauth_token_params: ''
oauth_token_request_auth_method: ''
oauth_body_format: ''
oauth_token_response_metadata: ''
oauth_authorization_method: ''
oauth_refresh_params: ''
oauth_token_field_name: ''
oauth_expiry_field_name: ''
oauth_expiry_strategy: ''
oauth_fixed_expiry_ms: ''
custom_fields:
- keyname: tomtom_api_key
  field_type: password
  name: TomTom API Key
  description: Free key from <a href="https://developer.tomtom.com/">developer.tomtom.com</a>
- keyname: origin
  field_type: string
  name: Origin
  description: lat,lng (ex. 38.707530,-9.136378)
- keyname: destination
  field_type: string
  name: Destination
  description: lat,lng (ex. 41.148836,-8.610915)
- keyname: arrive_by
  field_type: string
  name: Arrive by
  description: Desired arrival time as HH:mm (24h), later today
  placeholder: '09:00'
  default: '09:00'
  help_text: Interpreted in the destination's local time. It must still be in the future today, otherwise TomTom returns no route.
- keyname: route_label
  field_type: string
  name: Route Label
  description: Title on screen
  default: Leave by
- keyname: language
  field_type: select
  name: Language
  options:
  - en
  - pt
  default: en
- keyname: about_plugin
  name: About this plugin
  field_type: author_bio
  category: productivity,travel
  description: Leave-by commute times via <a href="https://developer.tomtom.com/">TomTom Routing</a>, by Diogo Loureiro. Set origin/destination as <code>lat,lng</code> and the time you need to arrive. Shows when to leave, trip duration, traffic, and alternatives.
  github_url: https://github.com/dfloureiro/TRMNL-plugins/tree/main/plugins/commute-leaveby
  learn_more_url: https://developer.tomtom.com/routing-api/documentation/tomtom-maps/v1/calculate-route
name: Commute - Leave By
description: When to leave to arrive on time
refresh_interval: 15
