# Publishes each plugin's companion web app to GitHub Pages, under the plugin's own path:
#   plugins/<plugin>/app/  →  https://<user>.github.io/<repo>/<plugin>/
# Nothing else in the repo is published. One-time setup: repo Settings → Pages → Source: GitHub Actions.
name: Plugin apps

on:
  push:
    branches: [main]
    paths: ["plugins/*/app/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect plugin apps
        run: |
          mkdir -p _site
          for app in plugins/*/app; do
            [ -d "$app" ] || continue
            plugin="$(basename "$(dirname "$app")")"
            cp -r "$app" "_site/$plugin"
            echo "Publishing $app at /$plugin/"
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
